<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light only">
    <meta name="theme-color" content="#ffffff">
    <title>Acceso — Anime2Chile</title>
    <link rel="icon" href="favicon.png?v=2" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Pathway+Extreme:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff6b35;
            --secondary: #ff8c42;
            --tertiary: #ffa45c;
            --dark: #2a2a2a;
            --gray: #6b6b6b;
            --light: #ffffff;
            --gradient: linear-gradient(135deg, #ff6b35 0%, #ff8c42 50%, #ffa45c 100%);
            --gradient-subtle: linear-gradient(160deg, #ffffff 0%, #fff8f4 45%, #fff0e8 100%);
            --font-display: 'Anton', Impact, Haettenschweiler, 'Arial Narrow', sans-serif;
            --font-heading: 'Bebas Neue', 'Arial Narrow', Impact, sans-serif;
            --font-body: 'Pathway Extreme', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        body {
            font-family: var(--font-body);
            color: var(--dark);
            background: var(--gradient-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            min-height: 100dvh;
            padding: 2rem 1.25rem;
            -webkit-text-size-adjust: 100%;
            overscroll-behavior: none;
        }

        .wrap {
            text-align: center;
            max-width: 380px;
            width: min(380px, 88vw);
            overflow: visible;
            animation: fadeUp 0.7s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: min(130px, 34vw);
            height: auto;
            margin: 0 auto 1.4rem;
            display: block;
            filter: drop-shadow(0 8px 24px rgba(255, 107, 53, 0.18));
        }

        h1 {
            display: inline-block;
            max-width: 100%;
            font-family: var(--font-display);
            font-size: clamp(1.55rem, 7.2vw, 2.6rem);
            letter-spacing: 0.06em;
            line-height: 1.2;
            text-transform: uppercase;
            white-space: nowrap;
            color: var(--primary);
            padding: 0.08em 0.2em;
            margin: 0 0 0.6rem;
        }

        .sub {
            font-family: var(--font-body);
            font-size: clamp(0.88rem, 2.8vw, 1rem);
            color: var(--gray);
            line-height: 1.55;
            margin-bottom: 1.4rem;
        }

        .acceso-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
            text-align: left;
        }

        .acceso-form label {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .acceso-form input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid #ead8ce;
            border-radius: 12px;
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--dark);
            background: #fff;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .acceso-form input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.15);
        }

        .acceso-form button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.8rem 1.5rem;
            border: 0;
            background: var(--gradient);
            color: #fff;
            font-family: var(--font-heading);
            font-size: 1.05rem;
            letter-spacing: 2px;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(255, 107, 53, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .acceso-form button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(255, 107, 53, 0.36);
        }

        .acceso-form button:active:not(:disabled) {
            transform: translateY(0);
        }

        .acceso-form button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .error {
            min-height: 1.25rem;
            margin-top: 0.15rem;
            font-size: 0.85rem;
            color: #c2410c;
            text-align: center;
        }

        .ig-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 1.35rem;
            color: var(--gray);
            text-decoration: none;
            font-size: 0.85rem;
        }

        .ig-link:hover {
            color: var(--primary);
        }

        .ig-link svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
            flex-shrink: 0;
        }

        @media (max-width: 480px) {
            body { padding: 1.25rem 1.25rem; }
            .wrap { width: min(340px, 90vw); max-width: none; }
            .logo {
                width: min(110px, 30vw);
                margin-bottom: 1.15rem;
            }
            h1 {
                font-size: clamp(1.45rem, 6.8vw, 1.95rem);
                letter-spacing: 0.05em;
            }
            .sub {
                font-size: 0.88rem;
                margin-bottom: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <img class="logo" src="anime2chile_logo.png" alt="Anime2Chile">
        <h1>Acceso</h1>
        <p class="sub">Ingresa la contraseña para entrar al sitio.</p>
        <form class="acceso-form" id="acceso-form" action="/api/acceso" method="post" autocomplete="on">
            <label for="password">Contraseña</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Contraseña"
                required
                autofocus
            >
            <button type="submit" id="acceso-btn">Entrar</button>
            <p class="error" id="acceso-error" hidden></p>
        </form>
        <a class="ig-link" href="https://instagram.com/anime2chile" target="_blank" rel="noopener noreferrer">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
            Instagram
        </a>
    </main>
    <script>
    (function () {
        var form = document.getElementById('acceso-form');
        var err = document.getElementById('acceso-error');
        var btn = document.getElementById('acceso-btn');
        var params = new URLSearchParams(window.location.search);

        function mostrarError(texto) {
            err.textContent = texto;
            err.hidden = false;
        }

        if (params.get('error') === 'rate') {
            mostrarError('Demasiados intentos. Espera unos minutos.');
        } else if (params.get('error')) {
            mostrarError('Contraseña incorrecta.');
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            err.hidden = true;
            btn.disabled = true;

            fetch('/api/acceso', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ password: document.getElementById('password').value })
            })
            .then(function (res) { return res.json().then(function (data) { return { res: res, data: data }; }); })
            .then(function (result) {
                if (result.data && result.data.ok) {
                    window.location.href = '/';
                    return;
                }
                mostrarError((result.data && result.data.message) || 'Contraseña incorrecta.');
            })
            .catch(function () {
                mostrarError('No se pudo conectar. Intenta de nuevo.');
            })
            .then(function () {
                btn.disabled = false;
            });
        });
    })();
    </script>
</body>
</html>
